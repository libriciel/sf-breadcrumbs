
.composer:
  image: php:8.2-cli
  before_script:
    - apt-get update
    - apt-get install zip unzip git -yqq
    - pecl install xdebug && docker-php-ext-enable xdebug
    - php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
    - php composer-setup.php
    - php -r "unlink('composer-setup.php');"
    - php composer.phar install


stages:
  - build
  - test
  - quality


variables:
  CONTAINER_IMAGE: "${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_NAME}"

build:
  stage: build
  tags:
    - citoyen-shell


unit_test:
  stage: test
  tags:
    - runner-citoyen
  image : $CONTAINER_IMAGE
  variables:
    XDEBUG_MODE: coverage
    GIT_STRATEGY: none
    ENV: test
  script:
    - cd /app
    - composer install
    - vendor/bin/phpunit --coverage-text --colors=never --coverage-clover coverage/coverage.xml --log-junit coverage/logfile.xml
  artifacts:
    paths:
      - coverage
    expire_in: 1h


code_quality:
  stage: quality
  tags:
    - cq-sans-dind
